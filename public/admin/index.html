<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <title>Panel · Siendo OTP por un día</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Solo viste el hueco previo a que arranque el CMS: a partir de ahí
         manda la interfaz de Sveltia, que trae su propio tema oscuro. */
      html {
        background: #0a0a0c;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0a0a0c;
        color: #efebe4;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      #cargando {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        text-align: center;
        padding: 24px;
      }

      #cargando img {
        width: 84px;
        height: 84px;
        border-radius: 16px;
        border: 1px solid #26262c;
      }

      #cargando b {
        font-family: 'Anton', 'Arial Narrow', sans-serif;
        font-size: 26px;
        font-weight: 400;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      #cargando b span {
        color: #f5342b;
      }

      #cargando small {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 11.5px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #85807a;
      }
    </style>
  </head>
  <body>
    <div id="cargando">
      <img src="/icon-192.png" alt="" />
      <b>Siendo <span>OTP</span> por un día</b>
      <small>Abriendo el panel…</small>
    </div>

    <!-- Versión pineada a propósito (esta página maneja tokens de GitHub):
         para actualizar, cambiar el número tras revisar el changelog. -->
    <script src="https://unpkg.com/@sveltia/cms@0.193.1/dist/sveltia-cms.js"></script>
    <script>
      // El CMS monta su interfaz en el body; en cuanto aparece, se retira el
      // cartel de carga (y como red de seguridad, a los 8 s).
      const cartel = document.getElementById('cargando');
      const quitar = () => cartel?.remove();
      new MutationObserver((_, obs) => {
        if (document.querySelector('#app, [class*="sveltia"]')) {
          quitar();
          obs.disconnect();
        }
      }).observe(document.body, { childList: true, subtree: true });
      setTimeout(quitar, 8000);
    </script>
  </body>
</html>
