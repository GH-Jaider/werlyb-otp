# Verifica que el lockfile este intacto (instalacion inmutable, sin scripts)
# y que el build funcione. Falla si alguien altero pnpm-lock.yaml a mano.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias (inmutable, sin scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Auditar vulnerabilidades conocidas
        run: pnpm audit --prod

      - name: Build
        run: pnpm build
