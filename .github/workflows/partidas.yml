# Actualiza las partidas de la serie cada noche con la API de Riot.
# Requiere el secret RIOT_API_KEY (una Personal App Key, que no caduca).
# Si hay partidas nuevas, committea y Vercel redespliega solo.
name: Actualizar partidas

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC, cada día
  # Al editar un episodio (panel, bot de vídeos o a mano) se recalcula en
  # minutos, sin esperar a la noche: si se cambió el rango de fechas o los
  # vídeos, las partidas del arco cambian con ellos.
  push:
    branches: [main]
    paths:
      - 'src/content/episodios/**'
      - 'src/data/cuentas.json'
      - 'scripts/partidas.mjs'
  workflow_dispatch: {}

# El backfill tarda ~15 min (límites de la API de Riot). Si se editan varios
# episodios seguidos, no tiene sentido encadenar una pasada por cada uno: se
# queda solo la última, que ya recalcula la serie entera.
concurrency:
  group: partidas
  cancel-in-progress: true

jobs:
  partidas:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bajar partidas de la API de Riot
        run: node scripts/partidas.mjs
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}

      - name: Commit si hay cambios
        run: |
          git config user.name "werlyb-otp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/partidas src/data/partidas-cache.json
          if git diff --cached --quiet; then
            echo "Sin partidas nuevas."
          else
            git commit -m "Partidas actualizadas ($(date -u +%F))"
            # por si main avanzó mientras corría el backfill
            git pull --rebase origin main
            git push
          fi
